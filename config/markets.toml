[market]
version = 1
convention = "latest completed provider observation; never implied live"
lookback_days = 60

[[instruments]]
id = "us-policy-rate"
label = "Effective federal funds rate"
asset_class = "rates"
provider = "fred"
series_id = "DFF"
units = "percent"
currency = "USD"
quote_status = "official_observation"
change_method = "basis_points"
max_age_days = 4
source_url = "https://fred.stlouisfed.org/series/DFF"


# ECB daily reference rates are deliberately registered but disabled until the
# SDMX response, publication-time and cross-rate contracts have live fixtures.
[[instruments]]
id = "eur-usd"
label = "EUR/USD ECB reference rate"
asset_class = "fx"
provider = "ecb"
series_id = "D.USD.EUR.SP00.A"
units = "USD_per_EUR"
currency = "USD"
quote_status = "official_fixing"
change_method = "percent"
max_age_days = 4
source_url = "https://data.ecb.europa.eu/data/datasets/EXR/EXR.D.USD.EUR.SP00.A"
enabled = false
unavailable_reason = "ECB SDMX adapter and three-sample live contract are not implemented yet."


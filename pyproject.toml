[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-sage"
version = "0.1.0"
description = "A prototype pipeline for collecting and summarizing macro-market research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "pydub>=0.25,<1",
    "requests>=2.32,<3",
    "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
crawlers = [
    "lxml>=5.3,<6",
    "pandas>=2.2,<3",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
local-whisper = [
    "openai-whisper>=20240930",
]

[project.scripts]
macro-sage = "main_prototype:main"

[tool.setuptools]
py-modules = [
    "audio_tools",
    "get_data",
    "main_prototype",
    "parcers",
    "summarization",
    "text_tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["drafts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-sage"
version = "0.5.0"
description = "A source-attributed daily macro research brief."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "lxml-html-clean>=0.4,<1",
    "openai>=2,<3",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "reportlab>=4,<6",
    "requests>=2.32,<3",
    "trafilatura>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]
[project.scripts]
macro-sage = "macro_sage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

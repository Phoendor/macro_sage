name: Generate Macro Brief

on:
  workflow_dispatch:
    inputs:
      date:
        description: Brief date in YYYY-MM-DD (blank uses today in Amsterdam)
        required: false
        type: string
  push:
    branches:
      - run/macro-brief

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MACRO_SAGE_TIMEZONE: Europe/Amsterdam

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -e ".[pdf]"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Select date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            TARGET_DATE="$REQUESTED_DATE"
          else
            TARGET_DATE="$(TZ=Europe/Amsterdam date +%F)"
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "Generating brief for $TARGET_DATE"

      - name: Verify secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Select an available synthesis model
        run: python scripts/select_openai_model.py

      - name: Collect and transcribe
        run: |
          python -m macro_sage run \
            --date "$TARGET_DATE" \
            --include-podcasts \
            --no-ai \
            --database data/macro_sage.sqlite3 \
            --output output

      - name: Synthesize from the cached collection
        run: |
          python -m macro_sage run \
            --date "$TARGET_DATE" \
            --include-podcasts \
            --database data/macro_sage.sqlite3 \
            --output output

      - name: Render PDF
        run: |
          mkdir -p output/pdf
          python scripts/render_pdf.py \
            --brief "output/$TARGET_DATE/brief.json" \
            --documents "output/$TARGET_DATE/documents.json" \
            --run "output/$TARGET_DATE/run.json" \
            --output "output/pdf/macro-sage-$TARGET_DATE.pdf"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: macro-sage-${{ env.TARGET_DATE }}
          path: |
            output/pdf/macro-sage-${{ env.TARGET_DATE }}.pdf
            output/${{ env.TARGET_DATE }}/brief.md
            output/${{ env.TARGET_DATE }}/brief.json
            output/${{ env.TARGET_DATE }}/run.json
          if-no-files-found: error
          retention-days: 7

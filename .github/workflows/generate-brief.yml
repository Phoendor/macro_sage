name: Generate Macro Brief

on:
  workflow_dispatch:
    inputs:
      date:
        description: Brief date in YYYY-MM-DD (blank uses today in Amsterdam)
        required: false
        type: string
      include_podcasts:
        description: Transcribe same-day podcast episodes
        required: true
        default: true
        type: boolean
      max_podcast_minutes:
        description: Maximum combined new audio minutes
        required: true
        default: 240
        type: number
  schedule:
    - cron: "30 19 * * 1-5"
      timezone: Europe/Amsterdam

permissions:
  contents: write

concurrency:
  group: macro-sage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MACRO_SAGE_TIMEZONE: Europe/Amsterdam
      MACRO_SAGE_MODEL: ${{ vars.MACRO_SAGE_MODEL }}
      MACRO_SAGE_MODEL_FALLBACKS: ${{ vars.MACRO_SAGE_MODEL_FALLBACKS }}
      MACRO_SAGE_TRANSCRIPTION_MODEL: ${{ vars.MACRO_SAGE_TRANSCRIPTION_MODEL }}
      MACRO_SAGE_TRANSCRIPTION_MODEL_FALLBACKS: ${{ vars.MACRO_SAGE_TRANSCRIPTION_MODEL_FALLBACKS }}
      MACRO_SAGE_REASONING_EFFORT: ${{ vars.MACRO_SAGE_REASONING_EFFORT }}
      MACRO_SAGE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v6
      - name: Check out durable brief history
        uses: actions/checkout@v6
        with:
          ref: macro-sage-history
          path: .history-store
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked application dependencies
        run: python -m pip install --constraint constraints.txt -e .

      - name: Select run options
        env:
          REQUESTED_PODCASTS: ${{ inputs.include_podcasts }}
          REQUESTED_MAX_MINUTES: ${{ inputs.max_podcast_minutes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            include_podcasts="true"
            max_podcast_minutes="240"
          else
            include_podcasts="${REQUESTED_PODCASTS:-true}"
            max_podcast_minutes="${REQUESTED_MAX_MINUTES:-240}"
          fi
          {
            echo "INCLUDE_PODCASTS=$include_podcasts"
            echo "MAX_PODCAST_MINUTES=$max_podcast_minutes"
          } >> "$GITHUB_ENV"
          echo "podcasts=$include_podcasts; audio budget=${max_podcast_minutes}m"

      - name: Install optional podcast system dependency
        run: |
          if [ "$INCLUDE_PODCASTS" = "true" ] && ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Resolve intended publication date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          args=(--output output/date-resolution.json --github-env "$GITHUB_ENV")
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            args+=(--scheduled)
          elif [ -n "$REQUESTED_DATE" ]; then
            args+=(--date "$REQUESTED_DATE")
          fi
          python -m macro_sage resolve-date "${args[@]}"

      - name: Verify secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Preflight OpenAI models
        run: |
          args=(--require-synthesis)
          if [ "$INCLUDE_PODCASTS" = "true" ]; then
            args+=(--require-transcription)
          fi
          python -m macro_sage models \
            "${args[@]}" \
            --output "output/runs/$MACRO_SAGE_RUN_ID/model-selection.json" \
            --run-record "output/runs/$MACRO_SAGE_RUN_ID/run.json" \
            --run-id "$MACRO_SAGE_RUN_ID"

      - name: Restore document and transcript cache
        uses: actions/cache/restore@v5
        with:
          path: data
          key: macro-sage-data-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            macro-sage-data-v3-${{ runner.os }}-

      - name: Collect sources
        id: collect
        run: |
          args=()
          if [ "$INCLUDE_PODCASTS" = "true" ]; then
            args+=(--include-podcasts --max-podcast-minutes "$MAX_PODCAST_MINUTES")
          fi
          python -m macro_sage collect \
            --date "$TARGET_DATE" \
            --date-resolution output/date-resolution.json \
            --run-id "$MACRO_SAGE_RUN_ID" \
            --database data/macro_sage.sqlite3 \
            --history .history-store \
            --require-history \
            --output output \
            --model-selection "output/runs/$MACRO_SAGE_RUN_ID/model-selection.json" \
            "${args[@]}"

      - name: Save document and transcript cache
        if: always() && steps.collect.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: data
          key: macro-sage-data-v3-${{ runner.os }}-${{ github.run_id }}

      - name: Synthesize and render PDF
        id: synthesize
        run: |
          python -m macro_sage synthesize \
            --date "$TARGET_DATE" \
            --date-resolution output/date-resolution.json \
            --run-id "$MACRO_SAGE_RUN_ID" \
            --output output \
            --history .history-store \
            --require-history \
            --model-selection "output/runs/$MACRO_SAGE_RUN_ID/model-selection.json"

      - name: Deliver report or no-data status to Telegram
        if: steps.synthesize.outcome == 'success' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        run: |
          python -m macro_sage deliver \
            --run-record "output/runs/$MACRO_SAGE_RUN_ID/run.json" \
            --state .history-store/delivery/telegram.json

      - name: Persist durable brief history
        run: |
          run_record="output/runs/$MACRO_SAGE_RUN_ID/run.json"
          history_record="$(jq -r '.history_record // empty' "$run_record")"
          git -C .history-store config user.name "github-actions[bot]"
          git -C .history-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .history-store/store.json ]; then
            git -C .history-store add store.json
          fi
          if [ -d .history-store/records ]; then
            git -C .history-store add records
          fi
          if [ -d .history-store/delivery ]; then
            git -C .history-store add delivery
          fi
          if git -C .history-store diff --cached --quiet; then
            echo "No new history or delivery state to persist."
          else
            git -C .history-store commit -m "history: save $TARGET_DATE run state"
            git -C .history-store push origin HEAD:macro-sage-history
          fi
          if [ -n "$history_record" ]; then
            python -m macro_sage confirm-history \
              --run-record "$run_record" \
              --backend github-branch:macro-sage-history
          else
            echo "No report history record was prepared (for example, a no-data run)."
          fi

      - name: Link run and artifacts
        if: always()
        run: |
          {
            echo "## Run and artifacts"
            echo
            echo "- Run ID: \`$MACRO_SAGE_RUN_ID\`"
            echo "- [Open this GitHub run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Safe artifact name: \`macro-sage-$TARGET_DATE-$MACRO_SAGE_RUN_ID\`"
            echo "- Download it from the **Artifacts** section at the bottom of this run page."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and audit trail
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macro-sage-${{ env.TARGET_DATE }}-${{ env.MACRO_SAGE_RUN_ID }}
          path: |
            output/pdf/macro-sage-${{ env.TARGET_DATE }}.pdf
            output/runs/${{ env.MACRO_SAGE_RUN_ID }}/report.pdf
            output/runs/${{ env.MACRO_SAGE_RUN_ID }}/brief.md
            output/runs/${{ env.MACRO_SAGE_RUN_ID }}/brief.json
            output/runs/${{ env.MACRO_SAGE_RUN_ID }}/manifest.json
            output/runs/${{ env.MACRO_SAGE_RUN_ID }}/run.json
            output/runs/${{ env.MACRO_SAGE_RUN_ID }}/source-status.md
            output/runs/${{ env.MACRO_SAGE_RUN_ID }}/model-selection.json
            output/date-resolution.json
          if-no-files-found: warn
          retention-days: 30
